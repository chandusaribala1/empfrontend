<section class="panel form-panel">
  <div class="panel-heading">
    <div>
      <p class="eyebrow">EMPLOYEE RECORD</p>
      <h2>{{ employee ? "Update employee" : "Add employee" }}</h2>
    </div>
  </div>
  <form class="employee-form" (ngSubmit)="save()" novalidate>
    <!-- novalidate allows save() to show field-specific validation messages below the inputs. -->
    <label
      >Full name
      <input
        #nameControl="ngModel"
        name="name"
        [(ngModel)]="name"
        required
        maxlength="120"
        placeholder=" Alex Morgan"
        [class.invalid-input]="
          (submitted || nameControl.touched) && !name.trim()
        "
      />
      @if ((submitted || nameControl.touched) && !name.trim()) {
        <small class="form-error">Please fill the required field.</small>
      }
    </label>
    <label
      >Email address
      <input
        #emailControl="ngModel"
        name="email"
        [(ngModel)]="email"
        required
        pattern="[A-Za-z0-9._%+-]+@gmail\.com"
        maxlength="254"
        type="email"
        placeholder="example@gmail.com"
        title="Use the format example@gmail.com"
        [class.invalid-input]="
          (submitted || emailControl.touched) &&
          (!email.trim() || !isValidEmail(email))
        "
      />
      @if ((submitted || emailControl.touched) && !email.trim()) {
        <small class="form-error">Please fill the required field.</small>
      } @else if ((submitted || emailControl.touched) && !isValidEmail(email)) {
        <small class="form-error">Please fill the correct details.</small>
      }
    </label>
    <label
      >Annual salary
      <input
        #salaryControl="ngModel"
        name="salary"
        [(ngModel)]="salary"
        required
        type="number"
        min="0.01"
        step="0.01"
        placeholder="75000"
        [class.invalid-input]="
          (submitted || salaryControl.touched) &&
          (salary === null || !isValidSalary())
        "
      />
      @if ((submitted || salaryControl.touched) && salary === null) {
        <small class="form-error">Please fill the required field.</small>
      } @else if ((submitted || salaryControl.touched) && !isValidSalary()) {
        <small class="form-error">Please fill the correct details.</small>
      }
    </label>
    <label
      >Department<select name="departmentId" [(ngModel)]="departmentId">
        <option [ngValue]="null">Unassigned</option>
        @for (department of departments; track department.id) {
          <option [ngValue]="department.id">{{ department.name }}</option>
        }
      </select></label
    >
    <div class="form-actions">
      <button type="submit" [disabled]="busy">
        {{ employee ? "Save changes" : "Create employee" }}
      </button>
      @if (employee) {
        <button type="button" class="secondary" (click)="cancel()">
          Cancel
        </button>
      }
    </div>
  </form>
</section>
